# Render Blueprint Configuration for MatatuConnect

services:
  - type: web
    name: matatuconnect-backend
    runtime: node
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: ""
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: ""
      - key: DB_USER
        value: ""
      - key: DB_PASSWORD
        value: ""
      - key: DB_SSL
        value: require
      - key: DB_CHANNEL_BINDING
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
